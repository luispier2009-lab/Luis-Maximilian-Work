<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LM-Alessandro — private website hub for commands, tickets, ideas and access management." />
  <link rel="icon" type="image/png" href="websiteicon.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Edit User · LM-Alessandro</title>
</head>
<body class="app-page" data-page="user-edit">

  <section class="hub open" id="hub">
    <div class="hub-shell">
      <aside class="hub-sidebar">
        <a href="dashboard.html" class="brand hub-brand"><span class="brand-mark">LM</span><span class="brand-name">LM-Alessandro</span></a>
        <nav class="hub-nav" aria-label="Hub navigation">
          <a data-nav="dashboard" data-gate="dashboard" href="dashboard.html">Dashboard</a>
          <a data-nav="tickets" data-gate="tickets" href="tickets.html">Tickets</a>
          <a data-nav="ideas" data-gate="ideas" href="ideas.html">Ideas</a>
          <a data-nav="commands" data-gate="commands" href="commands.html">Commands</a>
          <a data-nav="code" data-gate="code" href="code.html">Code Tabs</a>
          <a data-nav="users" data-gate="users" href="users.html">Users</a>
          <a data-nav="settings" data-gate="settings" href="settings.html">Settings</a>
        </nav>
        <button class="button secondary logout-button" type="button" id="logoutButton">Log Out</button>
      </aside>

      <div class="hub-main">
        <header class="hub-topbar">
          <div>
            <p class="label">Website Interface</p>
            <h2 id="hubWelcome">Welcome back.</h2>
          </div>
          <div class="account-pill" id="accountPill">User</div>
        </header>

        <main class="page-content" id="userEditPage">
          <div class="panel-header">
            <div><p class="label">Administration</p><h2 id="userEditTitle">Add User</h2></div>
            <a class="button secondary" href="users.html">Back</a>
          </div>
          <form class="user-form" id="userForm">
            <input id="editUserId" type="hidden" />
            <div class="form-row user-details-row">
              <input id="editUsername" type="text" placeholder="Username" required />
              <input id="editEmail" type="email" placeholder="Email optional" />
              <input id="editPassword" type="text" placeholder="Password" required />
              <select id="editRole" required><option>User</option><option>Staff</option><option>Admin</option><option>Owner</option></select>
              <select id="editStatus" required><option>Active</option><option>Suspended</option></select>
            </div>
            <div class="permission-box">
              <p>Permissions</p>
              <label><input type="checkbox" name="editPermissions" value="dashboard" /> Dashboard</label>
              <label><input type="checkbox" name="editPermissions" value="tickets.view" /> View Tickets</label>
              <label><input type="checkbox" name="editPermissions" value="tickets.create" /> Create Tickets</label>
              <label><input type="checkbox" name="editPermissions" value="tickets.manage" /> Manage Tickets</label>
              <label><input type="checkbox" name="editPermissions" value="ideas.view" /> View Ideas</label>
              <label><input type="checkbox" name="editPermissions" value="ideas.create" /> Create Ideas</label>
              <label><input type="checkbox" name="editPermissions" value="ideas.manage" /> Manage Ideas</label>
              <label><input type="checkbox" name="editPermissions" value="commands.view" /> View Commands</label>
              <label><input type="checkbox" name="editPermissions" value="commands.manage" /> Manage Commands</label>
              <label><input type="checkbox" name="editPermissions" value="code.view" /> View Code Tabs</label>
              <label><input type="checkbox" name="editPermissions" value="code.manage" /> Manage Code Tabs</label>
              <label><input type="checkbox" name="editPermissions" value="users.manage" /> Manage Users</label>
              <label><input type="checkbox" name="editPermissions" value="settings.manage" /> Manage Settings</label>
            </div>
            <div class="card-actions"><button class="button primary" type="submit">Save User</button><a class="button secondary" href="users.html">Cancel</a></div>
            <p class="form-message" id="userMessage"></p>
          </form>
        </main>

      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
